[package]
name = "git-glam-tauri"
version = "0.6.0"
description = "Git Glam desktop host"
authors = ["RubenGlam"]
license = "MIT"
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "git_glam_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2"

wait-timeout = "0.2"
rfd = "0.15"
open = "5"
keyring = { version = "3", features = ["windows-native"] }
sha2 = "0.10"
base64 = "0.22"
regex = "1"
rusty-leveldb = "4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
percent-encoding = "2"
aes-gcm = "0.10"
windows-sys = { version = "0.61", features = ["Win32_Security_Cryptography", "Win32_Foundation"] }
tempfile = "3"
tauri-plugin-updater = "2.14.1"
tauri-plugin-process = "2.4.0"
notify = "8"

